<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Token Meter</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        padding: 12px;
        box-sizing: border-box;
        background: var(--oc-bg);
        color: var(--oc-fg);
        font-family: var(--oc-font);
      }

      #root {
        height: 100%;
      }

      .tps-root {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .tps-notice:empty {
        display: none;
      }

      .tps-card {
        border: 1px solid var(--oc-border);
        background: var(--oc-muted-surface);
        border-radius: calc(var(--oc-radius) + 2px);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .tps-readout {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 8px;
      }

      .tps-readout-main {
        display: flex;
        align-items: baseline;
        gap: 6px;
        min-width: 0;
      }

      .tps-readout-badge {
        padding-bottom: 6px;
      }

      .tps-value {
        font-size: 3.125rem;
        line-height: 1;
        font-weight: 600;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
      }

      .tps-unit {
        color: var(--oc-muted);
        font-size: 0.875rem;
      }

      .tps-window {
        color: var(--oc-muted);
        font-size: 0.8125rem;
        margin-top: -6px;
      }

      .tps-bar {
        height: 8px;
        border-radius: 999px;
        background: var(--oc-selection);
        overflow: hidden;
      }

      .tps-bar-fill {
        width: 100%;
        height: 100%;
        background: var(--oc-primary);
        transform-origin: left center;
        transform: scaleX(0);
        transition: transform 160ms linear;
      }

      .tps-session-row {
        min-height: 1.25rem;
      }

      .tps-session {
        font-size: 0.8125rem;
        color: var(--oc-fg);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .tps-session[data-empty='true'] {
        color: var(--oc-muted);
      }

      .tps-details {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 12px;
        font-size: 0.8125rem;
      }

      .tps-detail-label {
        color: var(--oc-muted);
      }

      .tps-detail-value {
        margin: 0;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .tps-lastturn {
        gap: 2px;
      }

      .tps-block-label {
        color: var(--oc-muted);
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .tps-stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .tps-stat {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 10px 12px;
        border-radius: calc(var(--oc-radius) - 2px);
        background: var(--oc-bg);
      }

      .tps-stat-label {
        color: var(--oc-muted);
        font-size: 0.6875rem;
        line-height: 1.2;
      }

      .tps-stat-value {
        font-size: 1.0625rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .tps-usage-actions {
        display: flex;
        justify-content: flex-end;
      }

      .tps-usage-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .tps-cost {
        display: flex;
        align-items: baseline;
        gap: 6px;
        min-width: 0;
      }

      .tps-cost-label {
        color: var(--oc-muted);
        font-size: 0.75rem;
        white-space: nowrap;
      }

      .tps-cost-value {
        font-size: 0.9375rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .tps-lastturn-label {
        color: var(--oc-muted);
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .tps-lastturn-value {
        font-size: 1.75rem;
        line-height: 1.15;
        font-weight: 600;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }

      .tps-lastturn-value[data-state='empty'],
      .tps-lastturn-value[data-state='pending'] {
        color: var(--oc-muted);
        font-size: 1rem;
        font-weight: 500;
      }

      .tps-lastturn-meta {
        color: var(--oc-muted);
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
        min-height: 1rem;
      }

      .tps-footer {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .tps-note {
        color: var(--oc-muted);
        font-size: 0.75rem;
        line-height: 1.4;
      }

      .tps-actions {
        display: flex;
        justify-content: flex-end;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="main.js"></script>
  </body>
</html>
